allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // Fixed: Uses Gradle's native property mapping instead of manual XML parsing
                if (namespace == null) {
                    if (project.hasProperty('packageName') && project.packageName != null) {
                        namespace = project.packageName
                    } else {
                        // Fallback namespace to prevent Gradle 8+ build failure
                        namespace = "com.example.${project.name.replaceAll(/[^a-zA-Z0-9]/, '')}"
                    }
                }
                
                // 🟢 FORCE JAVA JVM TARGET TO 17 🟢
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        
        // 🟢 FORCE KOTLIN JVM TARGET TO 17 🟢
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
