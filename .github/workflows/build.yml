name: Build and Release Harmony APK

on:
  push:
    branches:
      - main
      - master

# 🟢 Give the robot permission to create releases 🟢
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1' 
          channel: 'stable'
          
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/harmony-key.jks
        
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../harmony-key.jks" >> android/key.properties

      - name: Get Dependencies
        run: flutter pub get
        
      - name: Fix on_audio_query_android Manifest for CI
        run: |
          sed -i 's/ *package="com\.lucasjosino\.on_audio_query"//g' ~/.pub-cache/hosted/pub.dev/on_audio_query_android-1.1.0/android/src/main/AndroidManifest.xml
          echo "✅ Manifest fixed for CI runner!"
      
      - name: Build Signed APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 🟢 NEW: DEBUG STEP TO VERIFY APK EXISTS 🟢
      - name: Verify APK exists before release
        run: |
          echo "🔍 Checking for APK..."
          ls -la build/app/outputs/flutter-apk/
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "❌ ERROR: app-release.apk not found! Build may have failed or output a different name."
            exit 1
          fi
          echo "✅ APK found! Proceeding to release..."
        
      - name: Create Release and Upload APK
        uses: ncipollo/release-action@v1.14.0 # 🟢 PINNED TO STABLE VERSION 🟢
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.0.${{ github.run_number }}" # 🟢 ADDED '1.0.' PREFIX FOR CLEANER SEMANTIC VERSIONING 🟢
          name: "Harmony Revived Build ${{ github.run_number }}"
          body: "Automated signed build."
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true # 🟢 REQUIRED FOR MODERN GITHUB API STABILITY 🟢