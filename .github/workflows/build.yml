name: Build and Release Harmony APK

on:
  push:
    branches:
      - main
      - master

# 🟢 THE FIX: Give the robot permission to create releases 🟢
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Make sure this matches your local 'flutter --version'
          flutter-version: '3.44.1' 
          channel: 'stable'
          
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/harmony-key.jks
        
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../harmony-key.jks" >> android/key.properties

      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build Signed APK
        run: flutter build apk --release --split-per-abi=false
        
      - name: Create Release and Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v${{ github.run_number }}" 
          name: "Harmony Revived Build ${{ github.run_number }}"
          body: "Automated signed build."
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true