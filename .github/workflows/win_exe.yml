name: Build Windows Portable
on: 
  workflow_dispatch: # Manual button
  push:
    tags:
      - 'win-*' # Triggers on tags like win-search-fix-1
  
jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.2'
          
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Update lang data
        run: dart localization/generator.dart

      - name: Set update check flag
        working-directory: "lib/utils"
        run: echo "const updateCheckFlag = true;" > update_check_flag_file.dart
        
      - name: Get Dependencies
        run: flutter pub get

      # 🟢 NATIVE FLUTTER BUILD (Bypasses flutter_distributor) 🟢
      - name: Build Windows App
        run: flutter build windows --release

      # 🟢 ZIP THE PORTABLE APP 🟢
      - name: Zip the Portable App
        shell: pwsh
        run: |
          # Zips the compiled app folder into a clean download
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "HarmonyMusic-Windows-Portable.zip"

      # 🟢 UPLOAD TO RELEASE (If triggered by Tag) 🟢
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: HarmonyMusic-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🟢 UPLOAD AS ARTIFACT (If triggered manually) 🟢
      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyMusic-Windows-Portable
          path: HarmonyMusic-Windows-Portable.zip