name: Build Windows exe 
on: 
  workflow_dispatch: # Manual button
  push:
    tags:
      - 'win-*' # 🟢 ONLY triggers when you push a tag starting with 'win-'
  
jobs:
  build-windows-exe:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.2'
      
      - name: Install InnoSetup
        run: choco install innosetup -y

      - name: Update lang data
        run: dart localization/generator.dart

      - name: Set update check flag to true
        working-directory: "${{ github.workspace }}/lib/utils"
        run: echo "const updateCheckFlag = true;" > update_check_flag_file.dart
        
      - name: Build windows exe package
        run: |
          flutter clean
          flutter pub get
          dart pub global activate flutter_distributor
          flutter_distributor package --platform windows --targets exe

      - name: Find .exe file
        id: find_exe
        shell: pwsh
        run: |
          # 🟢 FIXED: Safer recursive search for the .exe file
          $exeFile = Get-ChildItem -Path "${{ github.workspace }}/dist" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
              Write-Output "Found .exe file: $($exeFile.FullName)"
              # 🟢 FIXED: Updated to modern GitHub Actions output syntax
              echo "exe_path=$($exeFile.FullName)" >> $env:GITHUB_OUTPUT
          } else {
              Write-Error "No .exe files found in the dist directory."
              exit 1
          }
          
      # 🟢 REMOVED: All osslsigncode and DigiCert signing steps (Since you don't have the paid certs) 🟢

      - name: Upload to GitHub Release (If triggered by Tag)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.find_exe.outputs.exe_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (If triggered manually)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-Music-Windows-x64
          path: ${{ steps.find_exe.outputs.exe_path }}